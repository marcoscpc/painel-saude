<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Painel-Saúde</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Guarda uma cópia do erro de link mágico (expirado/inválido) antes que o
      // cliente Supabase (importado pelo main.jsx logo abaixo) tenha chance de
      // consumir e limpar a hash da URL sozinho — mesmo problema encontrado no
      // Forja em 04/08/2026 (ver src/lib/auth.js).
      (function () {
        var h = window.location.hash;
        if (h && h.indexOf("error_description=") !== -1) {
          try { sessionStorage.setItem("ps-authErr", h); } catch (e) {}
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
